name: Plugin store keep-alive

# Supabase pauses Free Plan projects that get too little database activity over
# a week; the plugin store (Supabase project "Forgor") then stops answering until
# it is resumed in the dashboard. Its docs say "a few user requests to the
# database each day" is typically enough: one read every 3 days was not (the
# store was paused from 4 to 25 November 2026). So this reads the store's plugin
# list (a database query) every 4 hours. The key is the publishable one the app
# also ships with (it can only read the list).
on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours, at :17
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the plugin list
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" --retry 3 --retry-delay 20 \
            "https://ltqtoxulavqwhsxywxej.supabase.co/rest/v1/store_plugins?select=id&limit=1" \
            -H "apikey: sb_publishable_9jjI76AcEZ7AXTBAGrYkvA_pSnMtXjJ")
          echo "Store answered $status: $(cat response.json)"
          if [ "$status" != "200" ]; then
            # Fails the run (and GitHub emails you).
            echo "::error::The plugin store isn't answering ($status). If the Supabase project \"Forgor\" is paused, resume it in the dashboard: https://supabase.com/dashboard/project/ltqtoxulavqwhsxywxej"
            exit 1
          fi
