[package]
name = "forgor"
version = "0.3.0"
description = "Forgor: work notes and todos"
authors = ["LLefu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "forgor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-fs = { version = "2.5.2", features = ["watch"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2"
# Meeting recordings: audio capture (mic + system loopback), local speech
# recognition (sherpa-onnx, statically linked) and local summaries (llama.cpp).
cpal = "0.18"
hound = "3"
sherpa-onnx = "1.13.8"
llama-cpp-2 = "0.1.157"
encoding_rs = "0.8"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.157", features = ["metal"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
