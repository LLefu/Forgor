# Windows: sherpa-onnx only ships static libraries built against the static C
# runtime (/MT), so everything else must use it too, or linking fails with
# "multiply defined symbols" / "RuntimeLibrary mismatch" (MSVCP140 vs libcpmt).
# - Rust code and cc-built C code follow +crt-static.
# - llama.cpp (CMake) needs CMAKE_MSVC_RUNTIME_LIBRARY: CMake otherwise adds /MD
#   after the -MT that LLAMA_STATIC_CRT passes. The cmake crate picks the
#   toolchain file up from CMAKE_TOOLCHAIN_FILE_<target>, so macOS is untouched.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
LLAMA_STATIC_CRT = "1"
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = ".cargo/msvc-static-crt.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc = { value = ".cargo/msvc-static-crt.cmake", relative = true }
